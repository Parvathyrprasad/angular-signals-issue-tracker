
<article
  class="issue-card"
  [class.overdue-card]="overdue()"
  (click)="openDetails()"
  tabindex="0"
  role="button"
  (keydown.enter)="openDetails()"
  (keydown.space)="openDetails(); $event.preventDefault()"
>
  <div class="card-top">
    <span class="issue-id">{{ issue().id }}</span>

    <span
      class="priority"
      [class.critical]="issue().priority === 'Critical'"
      [class.high]="issue().priority === 'High'"
      [class.medium]="issue().priority === 'Medium'"
      [class.low]="issue().priority === 'Low'"
    >
      {{ issue().priority }}
    </span>
  </div>

  <h3>{{ issue().title }}</h3>

  <div class="card-tags">
    <span class="type-tag">{{ issue().type }}</span>

    @if (overdue()) {
      <span class="overdue-label">Overdue</span>
    }
  </div>

  <div class="card-footer">
    <span class="assignee">
      <span class="avatar">
        {{ assigneeName().charAt(0) }}
      </span>
      {{ assigneeName() }}
    </span>

    <span class="due-date">
      @if (issue().dueDate) {
        {{ issue().dueDate }}
      } @else {
        No due date
      }
    </span>
  </div>

  <div class="story-points">
    {{ issue().storyPoints }} SP
  </div>
</article>
